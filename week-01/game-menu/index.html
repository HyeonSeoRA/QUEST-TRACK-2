<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 01 · 게임 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    padding: 48px 16px;
    font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    color: #eef2ff;
    background: radial-gradient(ellipse at 20% 10%, #2a1640 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, #0f2a4a 0%, transparent 55%),
                #070812;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 760px; }
  .week { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: .3em; opacity: .6; }
  h1 { font-family: 'Black Han Sans', sans-serif; font-weight: 400; font-size: clamp(40px, 9vw, 64px); margin: 6px 0 28px; }
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  a.game {
    display: block; text-decoration: none; color: inherit;
    padding: 24px 22px; border-radius: 20px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    transition: transform .15s, border-color .2s, background .2s;
  }
  a.game:hover { transform: translateY(-3px); border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.09); }
  .name { font-family: 'Black Han Sans', sans-serif; font-size: 34px; }
  .fire { background: linear-gradient(90deg, #ff8a3d, #b444ff, #3fb6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .t2048 { color: #f2b179; }
  .desc { font-size: 14px; opacity: .75; line-height: 1.6; margin-top: 8px; }
  .go { margin-top: 16px; font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: .15em; opacity: .8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="week">WEEK 01</div>
    <h1>게임 모음</h1>
    <div class="games">
      <a class="game" href="dance-of-fire-and-ice/">
        <div class="name fire">얼불춤</div>
        <div class="desc">불과 얼음의 행성이 도는 리듬 게임.<br>스테이지 5개 · 자동 플레이 · 싱크 보정</div>
        <div class="go">PLAY →</div>
      </a>
      <a class="game" href="2048/">
        <div class="name t2048">2048</div>
        <div class="desc">같은 숫자 타일을 합쳐 2048을 만드는 퍼즐.</div>
        <div class="go">PLAY →</div>
      </a>
    </div>
  </div>
</body>
</html>
