<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>검은 서약 — 기사의 보스 러시</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- 메뉴 화면에서 피어오르는 불씨 -->
    <div id="embers"></div>

    <!-- 전투 중 화면 위 정보 -->
    <div id="hud" class="hidden">
      <div id="player-box">
        <div class="label"><span class="gem"></span><span data-i18n>기사</span></div>
        <div class="bar hp-bar"><div id="p-hp-lag" class="lag"></div><div id="p-hp" class="fill"></div></div>
        <div class="row-hud">
          <div id="energy"><div class="seg"><i></i></div><div class="seg"><i></i></div><div class="seg"><i></i></div></div>
          <div id="potions"></div>
        </div>
        <div id="riposte" class="hidden" data-i18n>반격 준비!</div>
      </div>
      <div id="boss-box">
        <div id="boss-name">보스</div>
        <div class="bar boss-bar"><div id="b-hp-lag" class="lag"></div><div id="b-hp" class="fill"></div></div>
        <div class="bar posture-bar"><div id="b-posture" class="fill"></div></div>
      </div>
    </div>

    <!-- 보스 등장 이름 -->
    <div id="banner" class="hidden">
      <div id="banner-sub"></div>
      <div id="banner-title"></div>
      <div class="banner-line"></div>
    </div>

    <!-- 시작 화면 -->
    <section id="screen-title" class="screen hidden">
      <div class="candle left"><i class="flame"></i></div>
      <div class="candle right"><i class="flame"></i></div>
      <div class="title-block">
        <div class="eng" data-i18n>OATHBOUND</div>
        <h1 data-i18n>검은 서약</h1>
        <div class="divider"><span></span><b>✦</b><span></span></div>
        <p class="sub" data-i18n>다섯 괴물을 베어 서약을 지켜라</p>
      </div>
      <nav class="menu">
        <button class="nav plate" data-go="select" data-i18n>전투 시작</button>
        <button class="nav plate" data-go="help" data-i18n>조작법</button>
      </nav>
      <div id="lang-switch"><button data-lang="ko">한국어</button><i>·</i><button data-lang="en">English</button></div>
    </section>

    <!-- 조작법 -->
    <section id="screen-help" class="screen hidden">
      <div class="panel frame">
        <h2 data-i18n>조작법</h2>
        <div class="divider small"><span></span><b>✦</b><span></span></div>
        <div class="help-grid">
          <table class="keys">
            <tr><td><kbd>A</kbd><kbd>D</kbd></td><td data-i18n>이동</td></tr>
            <tr><td><kbd>W</kbd><kbd>Space</kbd></td><td data-i18n>점프 (짧게 누르면 낮게)</td></tr>
            <tr><td><kbd>Q</kbd></td><td data-i18n>원거리 참격 (기력 1칸)</td></tr>
            <tr><td><kbd>E</kbd></td><td data-i18n>근거리 공격 (3연타)</td></tr>
            <tr><td><kbd>F</kbd></td><td data-i18n>패링</td></tr>
            <tr><td><kbd>Shift</kbd></td><td data-i18n>대시 (잠깐 무적)</td></tr>
            <tr><td><kbd>R</kbd></td><td data-i18n>포션 (체력 40% 회복)</td></tr>
            <tr><td><kbd>Esc</kbd></td><td data-i18n>일시정지</td></tr>
          </table>
        </div>
        <button class="nav plate" data-go="title" data-i18n>돌아가기</button>
      </div>
    </section>

    <!-- 보스 고르기 -->
    <section id="screen-select" class="screen hidden">
      <h2 class="sel-title" data-i18n>도전할 괴물</h2>
      <div class="divider small"><span></span><b>✦</b><span></span></div>
      <div id="boss-list"></div>
      <div id="boss-detail" class="frame"></div>
      <div id="perk-list"></div>
      <div class="row">
        <button class="nav plate small" data-go="title" data-i18n>처음으로</button>
        <button id="btn-reset" class="nav plate small danger" data-i18n>기록 지우기</button>
      </div>
    </section>

    <!-- 일시정지 -->
    <section id="screen-pause" class="screen hidden">
      <div class="panel frame">
        <h2 data-i18n>일시정지</h2>
        <div class="divider small"><span></span><b>✦</b><span></span></div>
        <nav class="menu">
          <button id="btn-resume" class="nav plate" data-i18n>계속하기</button>
          <button id="btn-retry" class="nav plate" data-i18n>다시 도전</button>
          <button id="btn-quit" class="nav plate" data-i18n>보스 고르기로</button>
        </nav>
      </div>
    </section>

    <!-- 결과 -->
    <section id="screen-result" class="screen hidden">
      <div class="panel frame wide">
        <h2 id="result-title"></h2>
        <div class="divider small"><span></span><b>✦</b><span></span></div>
        <p id="result-text"></p>
        <div id="result-stats"></div>
        <div id="blessings"></div>
        <div class="row" id="result-buttons">
          <button id="btn-next" class="nav plate" data-i18n>다음 보스</button>
          <button id="btn-again" class="nav plate" data-i18n>다시 도전</button>
          <button id="btn-select" class="nav plate" data-i18n>보스 고르기</button>
        </div>
      </div>
    </section>

    <!-- 불러오는 중 -->
    <section id="screen-loading" class="screen">
      <div class="title-block">
        <div class="eng" data-i18n>OATHBOUND</div>
        <p class="sub"><span data-i18n>그림 불러오는 중…</span> <span id="load-pct">0</span>%</p>
      </div>
    </section>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/player.js"></script>
  <script src="js/boss-base.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
